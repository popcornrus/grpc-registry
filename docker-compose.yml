version: '3.8'

services:
  proxy-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: grpc-registry:latest
    container_name: grpc-proxy-manager
    ports:
      - "50051:50051"
    environment:
      - PROXY_PORT=50051
      - LOG_LEVEL=info
      - DEFAULT_TIMEOUT_SECONDS=10
      - DEFAULT_MAX_RETRIES=3
    networks:
      - grpc-network
    restart: unless-stopped

  cms-tracker:
    image: cms-tracker:latest
    container_name: cms-tracker
    environment:
      - LOG_LEVEL=info
    networks:
      - grpc-network
    restart: unless-stopped

networks:
  grpc-network:
    driver: bridge